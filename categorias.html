<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorias – Subsolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</head>

<body>
  <main class="app desk desk-cats white">
    <div data-include="topbar" data-desk></div>
    <section class="page">
      <p class="eyebrow">Explorar</p>
      <h1 class="brand-title" style="margin-top:28px">Categorias</h1>
      <div class="underline"></div>
      <a class="cat-card" href="produtos.html?cat=camisetas">
        <div class="photo"><img src="img/cat-camisetas-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Camisetas</h2><small>120 itens</small>
        </div>
      </a>
      <a class="cat-card flip" href="produtos.html?cat=moletons">
        <div class="photo"><img src="img/cat-moletons-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Moletons</h2><small>85 itens</small>
        </div>
      </a>
      <a class="cat-card" href="produtos.html?cat=calcas">
        <div class="photo"><img src="img/cat-calcas-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Calças</h2><small>64 itens</small>
        </div>
      </a>
      <a class="cat-card flip" href="produtos.html?cat=cargos">
        <div class="photo"><img src="img/cat-cargos-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Cargos</h2><small>32 itens</small>
        </div>
      </a>
      <a class="cat-card" href="produtos.html?cat=bermudas">
        <div class="photo"><img src="img/cat-bermudas-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Bermudas</h2><small>28 itens</small>
        </div>
      </a>
      <a class="cat-card flip" href="produtos.html?cat=tenis">
        <div class="photo"><img src="img/cat-tenis-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Tênis</h2><small>42 itens</small>
        </div>
      </a>
      <a class="cat-card" href="produtos.html?cat=acessorios">
        <div class="photo"><img src="img/cat-acessorios-tall.jpg" alt="" loading="lazy"></div>
        <div class="info">
          <h2>Acessórios</h2><small>95 itens</small>
        </div>
      </a>
    </section>
    <div data-include="footer" data-desk-only></div>
    <div data-include="tabbar" data-active="home"></div>
  </main>
</body>

</html>
