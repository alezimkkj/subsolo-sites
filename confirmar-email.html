<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme seu e-mail – Subsolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</head>

<body>
  <main class="app confirm">
    <section class="page center" style="padding-top:44px">
      <p class="logo"><img src="img/logo.png" alt="Subsolo"></p>
      <div class="mail-circle" data-icon="mail"></div>
      <h1 class="heading" style="font-size:30px">Confirme seu e-mail</h1>
      <p class="muted" style="line-height:1.6;margin-top:14px;font-size:16px">Enviamos um link de confirmação para o
        endereço informado. Acesse sua caixa de entrada e siga as instruções para ativar sua conta.</p>
      <div class="email-pill"><span data-email-text>usuario@exemplo.com.br</span><button type="button" data-edit-email
          aria-label="Editar e-mail" data-icon="edit"></button></div>
      <a class="btn" href="onboarding.html">Já confirmei meu e-mail</a>
      <p style="margin-top:22px"><button class="link" data-feedback="E-mail reenviado!">Reenviar e-mail</button></p>
      <div class="infobox"><span data-icon="info"></span><span>Não encontrou a mensagem? Confira também a pasta de
          spam.</span></div>
      <a class="back-link" href="cadastro.html">← Voltar para o cadastro</a>
    </section>
  </main>
</body>

</html>
